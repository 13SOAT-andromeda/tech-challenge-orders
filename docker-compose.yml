services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    networks:
      - orders-net

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sns,sqs
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    networks:
      - orders-net

  bootstrap:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./deploy/localstack:/bootstrap
    entrypoint: ["/bootstrap/bootstrap.sh"]
    networks:
      - orders-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: "${ENV:-development}"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      ENV: ${ENV:-development}
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE: orders
      ORDERS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:orders-events-topic
      USERS_BASE_URL: http://users-mock:8081
      STOCK_BASE_URL: http://stock-mock:8082
      PUBLIC_BASE_URL: http://localhost:8080
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${ENV:-development}
      DD_SERVICE: ${DD_SERVICE:-tech-challenge-api}
      DD_VERSION: ${API_VERSION:-1.0.0}
    ports:
      - "8080:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orders-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: "${ENV:-development}"
    command: ["go", "run", "./cmd/worker"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      ENV: ${ENV:-development}
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_TABLE: orders
      ORDERS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:orders-events-topic
      SQS_STOCK_AVAILABLE_URL: http://localstack:4566/000000000000/orders-stock-available-queue
      SQS_STOCK_UNAVAILABLE_URL: http://localstack:4566/000000000000/orders-stock-unavailable-queue
      SQS_STOCK_UPDATED_URL: http://localstack:4566/000000000000/orders-stock-updated-queue
      SQS_PAYMENT_EVENTS_URL: http://localstack:4566/000000000000/orders-payment-events-queue
      USERS_BASE_URL: http://users-mock:8081
      STOCK_BASE_URL: http://stock-mock:8082
    restart: on-failure
    networks:
      - orders-net

  users-mock:
    image: mockoon/cli:latest
    command: ["--data", "/data/users.json", "--port", "8081"]
    volumes:
      - ./deploy/mocks:/data
    networks:
      - orders-net

  stock-mock:
    image: mockoon/cli:latest
    command: ["--data", "/data/stock.json", "--port", "8082"]
    volumes:
      - ./deploy/mocks:/data
    networks:
      - orders-net

  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    env_file:
      - .env
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE: "name:datadog-agent"
      DD_APPSEC_ENABLED: "true"
      DD_REMOTE_CONFIGURATION_ENABLED: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
    ports:
      - "8125:8125/udp"
      - "8126:8126"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - ./datadog/conf.d/http_check.yaml:/etc/datadog-agent/conf.d/http_check.yaml:ro
    networks:
      - orders-net

networks:
  orders-net:
    name: orders-net
    driver: bridge
