apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-challenge-orders-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tech-challenge-orders-worker
  template:
    metadata:
      labels:
        app: tech-challenge-orders-worker
    spec:
      containers:
        - name: worker
          image: tech-challenge-orders-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
