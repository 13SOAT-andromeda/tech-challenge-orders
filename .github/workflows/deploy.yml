name: Deploy to AWS

on:
  push:
    branches: [main]
    # paths:
    #   - 'cmd/**'
    #   - 'internal/**'
    #   - 'pkg/**'
    #   - 'k8s/**'
    #   - 'Dockerfile'
    #   - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-orders-api-repo
          IMAGE_TAG: latest
        run: |
          docker build --target production -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name eks-tech-challenge

      - name: Generate overlay env files
        run: |
          printf 'DD_API_KEY=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n' \
            "${{ secrets.DD_API_KEY }}" \
            "${{ secrets.AWS_ACCESS_KEY_ID }}" \
            "${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            "${{ secrets.AWS_SESSION_TOKEN }}" \
            > k8s/overlays/aws/.env.secrets

          printf 'AWS_REGION=%s\nORDERS_TOPIC_ARN=%s\nNOTIFICATION_TOPIC_ARN=%s\nSQS_CATALOG_EVENTS_URL=%s\nSQS_PAYMENT_EVENTS_URL=%s\nUSERS_BASE_URL=%s\nSTOCK_BASE_URL=%s\nPUBLIC_BASE_URL=%s\nDD_SERVICE=%s\nDD_VERSION=%s\nDD_SITE=%s\n' \
            "${{ secrets.AWS_REGION }}" \
            "arn:aws:sns:${{ secrets.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:${{ vars.SNS_ORDERS_TOPIC_NAME }}" \
            "arn:aws:sns:${{ secrets.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:${{ vars.SNS_NOTIFICATION_TOPIC_NAME }}" \
            "https://sqs.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.AWS_ACCOUNT_ID }}/${{ vars.SQS_CATALOG_QUEUE_NAME }}" \
            "https://sqs.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.AWS_ACCOUNT_ID }}/${{ vars.SQS_ORDERS_QUEUE_NAME }}" \
            "http://tech-challenge-users-svc.default.svc.cluster.local" \
            "http://catalog-api-svc.default.svc.cluster.local" \
            "${{ secrets.PUBLIC_BASE_URL }}/dev/v1" \
            "${{ vars.DD_SERVICE }}" \
            "${{ vars.DD_VERSION }}" \
            "${{ vars.DD_SITE }}" \
            > k8s/overlays/aws/.env.host

      - name: Apply Kustomize
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-orders-api-repo
        run: |
          kubectl kustomize k8s/overlays/aws | \
            sed "s|ECR_IMAGE:latest|$ECR_REGISTRY/$ECR_REPOSITORY:latest|g" | \
            kubectl apply -f -

      - name: Restart deployments
        run: |
          kubectl rollout restart deployment tech-challenge-orders-api
          kubectl rollout restart deployment tech-challenge-orders-worker
